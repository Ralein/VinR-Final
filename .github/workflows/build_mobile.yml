name: Build Mobile Packages (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinR-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate iOS project files
        run: |
          flutter build ios --release --no-codesign --config-only

      - name: Run pod install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App via xcodebuild (No Code Signing)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/VinR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcpretty

      - name: Package IPA from Archive
        run: |
          mkdir -p build/ios/ipa_output/Payload
          cp -r "build/ios/VinR.xcarchive/Products/Applications/Runner.app" \
            build/ios/ipa_output/Payload/
          cd build/ios/ipa_output
          zip -r -q VinR-iOS-Package.ipa Payload
          ls -lh VinR-iOS-Package.ipa

      - name: Upload iOS IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: VinR-iOS-Package-IPA
          path: build/ios/ipa_output/VinR-iOS-Package.ipa
          if-no-files-found: error
